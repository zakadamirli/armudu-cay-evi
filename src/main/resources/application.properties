spring.application.name=armudu-cay-evi
server.port=${PORT:8080}
server.compression.enabled=true
server.error.include-stacktrace=never
server.error.include-message=never

# Database: override with DB_URL, DB_USERNAME, DB_PASSWORD env vars in production
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/armudu}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Admin login (HTTP Basic). ADMIN_PASSWORD must be set in production.
armudu.admin.username=${ADMIN_USERNAME:admin}
armudu.admin.password=${ADMIN_PASSWORD:armudu-admin}

# i18n message bundles
spring.messages.basename=messages
spring.messages.encoding=UTF-8
# Do not fall back to the system locale; use messages.properties (az) when a key is missing
spring.messages.fallback-to-system-locale=false

# Actuator: expose only health
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# Reservation rules
armudu.slot-capacity=30
armudu.opening-time=10:00
armudu.last-seating=23:30
armudu.max-days-ahead=60
