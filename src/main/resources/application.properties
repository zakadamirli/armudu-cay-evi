spring.application.name=armudu-cay-evi
server.port=${PORT:8080}
server.compression.enabled=true
server.error.include-stacktrace=never
server.error.include-message=never

# Baza: serverdə DB_URL, DB_USERNAME, DB_PASSWORD mühit dəyişənləri ilə dəyişdirin
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/armudu}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Admin girişi (HTTP Basic). Prodda ADMIN_PASSWORD mütləq təyin edilməlidir.
armudu.admin.username=${ADMIN_USERNAME:admin}
armudu.admin.password=${ADMIN_PASSWORD:armudu-admin}

# Actuator: yalnız health açıqdır
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# Rezerv qaydaları
armudu.slot-capacity=30
armudu.opening-time=10:00
armudu.last-seating=23:30
armudu.max-days-ahead=60
